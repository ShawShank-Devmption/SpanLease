# SpanLease pinned dependency catalog — the ONLY place versions are written.
# Modules reference these aliases; never put a version literal in a build.gradle.kts.
# Validate grpc / protobuf / opentelemetry together when changing pins.
# These are compatibility pins, not a claim that they are the latest releases.

[versions]
java = "21"
gradle = "8.12.1"
distribution-sha256 = "8d97a97984f6cbd2b85fe4c60a743440a347544bf18818048e611f5288d46c94"
grpc = "1.68.1"
protobuf = "4.28.3"
opentelemetry = "1.45.0"          # BOM: SDK, OTLP exporter, logs API
jackson = "2.18.2"
junit = "5.11.4"
junit-platform = "1.11.4"
assertj = "3.26.3"
jqwik = "1.9.2"
protobuf-plugin = "0.9.4"
spotless-plugin = "6.25.0"
google-java-format = "1.24.0"

[libraries]
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
grpc-genjava = { module = "io.grpc:protoc-gen-grpc-java", version.ref = "grpc" }
otel-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
otel-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
otel-sdk-logs = { module = "io.opentelemetry:opentelemetry-sdk-logs" }
otel-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
otel-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version = "1.3.2-alpha" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-plugin" }
