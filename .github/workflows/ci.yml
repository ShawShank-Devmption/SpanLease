name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, format check, unit + property tests
        run: ./gradlew --no-daemon build
      # I-CI adds mandatory integrationTest execution with the real detector litmus suite.
      # A-BOOT's loopback compatibility test is part of test, not that litmus suite.
