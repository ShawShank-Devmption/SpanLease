name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Monitor DOM regressions
        run: node --test testbed/src/test/js/monitor.test.cjs
      - name: Build, format check, unit + property tests
        run: ./gradlew --no-daemon build
      - name: Litmus integration tests
        run: ./gradlew --no-daemon integrationTest
      - name: Upload test reports and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-and-results
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
