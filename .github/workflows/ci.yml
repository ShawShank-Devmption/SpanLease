name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, format check, unit + property tests
        run: ./gradlew --no-daemon build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Evaluation statistics checks
        run: python3 -m unittest discover -s eval/tests -v
      - name: Real gRPC and OTLP analyzer-process litmus tests
        run: ./gradlew --no-daemon :testbed:integrationTest
      - name: Upload test results and live-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
            testbed/build/integration-runs/
          if-no-files-found: warn
